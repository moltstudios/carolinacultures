<meta name="color-scheme" content="light dark"><title>Carolina Cultures Co. — animated logo</title>
<style>
  html,body{margin:0;min-height:100%}

  body.dark{--bg:#151815;--fg:#f4f8f4}

  #stage{width:min(92vw,640px)} #stage svg{width:100%;height:auto;display:block}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;padding:10px 22px;font:inherit;font-weight:600;cursor:pointer}
  button[aria-pressed=true],button:hover{background:var(--fg);color:var(--bg)}
  button:focus-visible{outline:3px solid #7ab744;outline-offset:2px}
</style></head><body><main>
<div id="stage"></div>
<div class="row" role="group" aria-label="Background">

  <button id="replay" type="button">Replay</button>
</div>

<script>
const stage=document.getElementById('stage');let mode='light';
const show=()=>{stage.innerHTML='';requestAnimationFrame(()=>stage.innerHTML=document.getElementById('svg-'+mode).textContent);};
const set=m=>{mode=m;document.body.classList.toggle('dark',m==='dark');
  document.getElementById('light').setAttribute('aria-pressed',m==='light');
  document.getElementById('darkbtn').setAttribute('aria-pressed',m==='dark');show();};
document.getElementById('light').onclick=()=>set('light');
document.getElementById('darkbtn').onclick=()=>set('dark');
document.getElementById('replay').onclick=show;
set(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
</script></body></html>
